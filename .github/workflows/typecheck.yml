name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

# Worker TypeScript only — no deploy, no Cloudflare credentials.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Apply D1 migrations to empty local database
        env:
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        run: |
          persist="$(mktemp -d)"
          npx wrangler d1 migrations apply postgrove --local --persist-to "$persist"
